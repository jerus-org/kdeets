[package]
name = "kdeets"
version = "0.1.32"
description = "Query crates.io for information about a crate."
documentation = "https://docs.rs/kdeets"
readme = "README.md"
include = ["**/*.rs", "Cargo.toml", "README.md", "LICENSE"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "kdeets_lib"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/kdeets-v{ version }/kdeets-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-binstall signature verification. The pubkey is a placeholder in source:
# the release pipeline generates an ephemeral minisign/rsign keypair, signs the
# tarball, and `pcu release inject-pubkey` replaces the `pubkey` value below with
# that release's public key before the crate is published. Without this section
# pcu has nothing to replace and the release fails at the inject step.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWPLACEHOLDER0000000000000000000000000000000"

[dependencies]
clap.workspace = true
clap-verbosity.workspace = true
clap-verbosity-flag.workspace = true
colorful.workspace = true
env_logger.workspace = true
log.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
semver.workspace = true
smol_str.workspace = true
tame-index.workspace = true
thiserror.workspace = true
webpki-roots = "1.0.9"

[dev-dependencies]
fs_extra.workspace = true
rstest.workspace = true
simple_logger.workspace = true
tempfile.workspace = true
trycmd.workspace = true

[lints]
workspace = true
